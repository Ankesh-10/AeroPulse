[pytest]
pythonpath = src
testpaths = tests
addopts = --strict-markers -ra -m "not slow"
markers =
    unit: fast tests on tiny synthetic frames (never read data_raw/)
    data: needs the 12 C-MAPSS files in data_raw/ (skipped when absent)
    artifacts: needs models/ and outputs/ produced by a run (skipped when absent)
    slow: takes more than ~30 s
